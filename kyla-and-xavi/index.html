<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noimageindex">
<meta name="referrer" content="no-referrer">
<title>KYLA + XAVI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f5;
  --ink:#2b2926;
  --muted:#8d8781;
  --line:#e2ddd6;
  --gap:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  padding:0 clamp(18px,4vw,56px) 90px;
}

/* ---------- header ---------- */
header{
  text-align:center;
  padding:clamp(56px,10vh,110px) 0 clamp(30px,5vh,50px);
}
h1{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:300;
  font-size:clamp(22px,3.1vw,34px);
  letter-spacing:.34em;
  text-transform:uppercase;
  text-indent:.34em;
  line-height:1.35;
}
.date{
  margin-top:14px;
  font-size:11px;
  letter-spacing:.42em;
  text-indent:.42em;
  color:var(--muted);
}

/* ---------- toggle ---------- */
.toggle{
  display:flex;
  justify-content:center;
  margin:clamp(34px,6vh,58px) auto clamp(30px,5vh,46px);
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px;
  width:max-content;
  background:rgba(255,255,255,.5);
}
.toggle button{
  font:inherit;
  font-size:10.5px;
  letter-spacing:.24em;
  text-indent:.24em;
  text-transform:uppercase;
  color:var(--muted);
  background:none;
  border:0;
  padding:10px 26px;
  border-radius:999px;
  cursor:pointer;
  transition:color .25s ease,background .25s ease;
}
.toggle button[aria-selected="true"]{
  background:var(--ink);
  color:var(--bg);
}

/* ---------- section rule ---------- */
.divider{
  max-width:1500px;
  margin:clamp(48px,8vh,86px) auto clamp(28px,4vh,42px);
  text-align:center;
  font-size:10px;
  letter-spacing:.36em;
  text-indent:.36em;
  text-transform:uppercase;
  color:var(--muted);
  position:relative;
}
.divider::before,.divider::after{
  content:"";
  position:absolute;
  top:50%;
  width:clamp(40px,16%,180px);
  height:1px;
  background:var(--line);
}
.divider::before{left:6%}
.divider::after{right:6%}

/* ---------- gallery ---------- */
.grid{
  column-count:3;
  column-gap:var(--gap);
  max-width:1500px;
  margin:0 auto;
}
@media(max-width:900px){.grid{column-count:2}}
@media(max-width:560px){.grid{column-count:1}}
#videoGrid{column-count:2}
@media(max-width:900px){#videoGrid{column-count:1}}
.tile{
  position:relative;
  break-inside:avoid;
  margin-bottom:var(--gap);
  cursor:zoom-in;
  background:#efeae4;
  overflow:hidden;
}
.tile img{
  display:block;
  width:100%;
  height:auto;
  opacity:0;
  transition:opacity .7s ease,transform .6s ease;
}
.tile img.loaded{opacity:1}
.tile:hover img{transform:scale(1.02)}

/* play badge on video tiles */
.tile.video::after{
  content:"";
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%,-50%);
  width:54px; height:54px;
  border-radius:50%;
  background:rgba(250,248,245,.9);
  transition:transform .3s ease;
}
.tile.video::before{
  content:"";
  position:absolute;
  left:50%; top:50%;
  transform:translate(-38%,-50%);
  border-left:15px solid var(--ink);
  border-top:9px solid transparent;
  border-bottom:9px solid transparent;
  z-index:2;
}
.tile.video:hover::after{transform:translate(-50%,-50%) scale(1.1)}
.dur{
  position:absolute;
  right:10px; bottom:10px;
  z-index:2;
  font-size:10px;
  letter-spacing:.1em;
  color:var(--bg);
  background:rgba(43,41,38,.62);
  padding:4px 9px;
  border-radius:999px;
  font-variant-numeric:tabular-nums;
}

/* ---------- slideshow ---------- */
#slideshow{
  max-width:1200px;
  margin:0 auto;
  display:none;
  flex-direction:column;
  align-items:center;
}
#slideshow.on{display:flex}
.stage{
  width:100%;
  height:min(72vh,780px);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.stage img,.stage video{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  opacity:0;
  transition:opacity .55s ease;
}
.stage img{cursor:zoom-in}
.stage img.show,.stage video.show{opacity:1}
.stage video{display:none}
.stage video.show{display:block}
.controls{
  display:flex;
  align-items:center;
  gap:22px;
  margin-top:26px;
  font-size:10.5px;
  letter-spacing:.22em;
  color:var(--muted);
}
.controls button{
  font:inherit;
  letter-spacing:.22em;
  text-transform:uppercase;
  background:none;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--ink);
  padding:9px 20px;
  cursor:pointer;
  transition:border-color .2s,background .2s;
}
.controls button:hover{border-color:var(--ink);background:rgba(0,0,0,.03)}
.counter{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- lightbox ---------- */
#lightbox{
  position:fixed;
  inset:0;
  background:rgba(250,248,245,.985);
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:56px 20px 26px;
}
#lightbox.on{display:flex}
#lbImg,#lbVid{
  max-width:100%;
  max-height:calc(100vh - 150px);
  object-fit:contain;
}
#lbVid{display:none}
.lb-bar{
  display:flex;
  align-items:center;
  gap:20px;
  margin-top:22px;
  font-size:10.5px;
  letter-spacing:.22em;
  color:var(--muted);
}
.lb-bar a,.lb-bar button{
  font:inherit;
  font-size:10.5px;
  letter-spacing:.22em;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--ink);
  background:none;
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 20px;
  cursor:pointer;
  transition:border-color .2s,background .2s;
}
.lb-bar a:hover,.lb-bar button:hover{border-color:var(--ink);background:rgba(0,0,0,.03)}
.lb-close{
  position:absolute;
  top:20px;
  right:24px;
  font-size:22px;
  line-height:1;
  padding:6px 12px !important;
  border:0 !important;
  color:var(--muted) !important;
  letter-spacing:0 !important;
}
.lb-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:26px;
  color:var(--muted);
  background:none;
  border:0;
  cursor:pointer;
  padding:16px 20px;
  user-select:none;
  transition:color .2s;
  z-index:3;
}
.lb-nav:hover{color:var(--ink)}
.lb-prev{left:6px}
.lb-next{right:6px}
@media(max-width:640px){.lb-nav{font-size:20px;padding:12px}}

footer{
  text-align:center;
  margin-top:80px;
  font-size:10px;
  letter-spacing:.32em;
  text-indent:.32em;
  color:var(--muted);
  text-transform:uppercase;
}
</style>
</head>
<body>

<header>
  <h1>Kyla + Xavi</h1>
  <div class="date">12.06.23</div>
</header>

<nav class="toggle" role="tablist" aria-label="View mode">
  <button id="tabGallery" role="tab" aria-selected="true">Gallery</button>
  <button id="tabSlides" role="tab" aria-selected="false">Slideshow</button>
</nav>

<main>
  <div id="galleryWrap">
    <div class="grid" id="photoGrid"></div>
    <div class="divider">Moving Pictures</div>
    <div class="grid" id="videoGrid"></div>
  </div>

  <section id="slideshow">
    <div class="stage">
      <img id="slideImg" alt="">
      <video id="slideVid" controls playsinline preload="metadata"></video>
    </div>
    <div class="controls">
      <button id="sPrev">Prev</button>
      <button id="sPlay">Play</button>
      <span class="counter" id="sCount">1 / 1</span>
      <button id="sNext">Next</button>
    </div>
  </section>
</main>

<div id="lightbox" role="dialog" aria-modal="true">
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
  <img id="lbImg" alt="">
  <video id="lbVid" controls playsinline preload="metadata"></video>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&#8250;</button>
  <div class="lb-bar">
    <a id="lbDownload" download>Download</a>
    <span id="lbCount"></span>
  </div>
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
</div>

<footer>12 . 06 . 2023</footer>

<script src="photos.js"></script>
<script>
const THUMB='photos/thumbs/', LARGE='photos/large/', FULL='photos/full/',
      VID='videos/', POSTER='videos/posters/';

const isVid = m => m.type === 'video';
const enc = s => encodeURIComponent(s);
const posterOf = m => POSTER + enc(m.f.replace(/\.mp4$/, '.jpg'));
const viewSrc = m => isVid(m) ? VID + enc(m.f) : LARGE + enc(m.f);
const dlSrc   = m => isVid(m) ? VID + enc(m.f) : FULL + enc(m.f);
const fmt = s => Math.floor(s/60) + ':' + String(Math.round(s%60)).padStart(2,'0');

let idx = 0, playing = false, timer = null;

/* ---------- gallery ---------- */
const photoGrid = document.getElementById('photoGrid');
const videoGrid = document.getElementById('videoGrid');

MEDIA.forEach((m, i) => {
  const d = document.createElement('div');
  d.className = 'tile' + (isVid(m) ? ' video' : '');
  d.style.aspectRatio = m.w + '/' + m.h;
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.decoding = 'async';
  img.src = isVid(m) ? posterOf(m) : THUMB + enc(m.f);
  img.alt = (isVid(m) ? 'Wedding video ' : 'Wedding photo ') + (i + 1);
  img.addEventListener('load', () => img.classList.add('loaded'));
  if (img.complete) img.classList.add('loaded');
  d.appendChild(img);
  if (isVid(m)) {
    const s = document.createElement('span');
    s.className = 'dur';
    s.textContent = fmt(m.dur);
    d.appendChild(s);
  }
  d.addEventListener('click', () => openLB(i));
  (isVid(m) ? videoGrid : photoGrid).appendChild(d);
});

/* ---------- view toggle ---------- */
const tabG = document.getElementById('tabGallery');
const tabS = document.getElementById('tabSlides');
const slideshow = document.getElementById('slideshow');
const galleryWrap = document.getElementById('galleryWrap');

function setView(mode){
  const g = mode === 'gallery';
  tabG.setAttribute('aria-selected', g);
  tabS.setAttribute('aria-selected', !g);
  galleryWrap.style.display = g ? '' : 'none';
  slideshow.classList.toggle('on', !g);
  if (g) { stop(); slideVid.pause(); } else { render(); }
}
tabG.onclick = () => setView('gallery');
tabS.onclick = () => setView('slides');

/* ---------- slideshow ---------- */
const slideImg = document.getElementById('slideImg');
const slideVid = document.getElementById('slideVid');
const sCount = document.getElementById('sCount');
const sPlay = document.getElementById('sPlay');

function render(){
  const m = MEDIA[idx];
  sCount.textContent = (idx + 1) + ' / ' + MEDIA.length;

  if (isVid(m)) {
    slideImg.classList.remove('show');
    slideVid.src = viewSrc(m);
    slideVid.poster = posterOf(m);
    slideVid.classList.add('show');
    // autoplay muted while the slideshow is running, then advance on end
    if (playing) { slideVid.muted = true; slideVid.play().catch(()=>{}); }
  } else {
    slideVid.pause();
    slideVid.classList.remove('show');
    slideVid.removeAttribute('src');
    slideVid.load();
    slideImg.classList.remove('show');
    const next = new Image();
    next.onload = () => { slideImg.src = next.src; slideImg.classList.add('show'); };
    next.src = viewSrc(m);
    slideImg.alt = 'Wedding photo ' + (idx + 1);
  }

  const nx = MEDIA[(idx + 1) % MEDIA.length];
  if (!isVid(nx)) new Image().src = viewSrc(nx);
  schedule();
}

/* advance timer: photos on a fixed interval, videos when they finish */
function schedule(){
  clearInterval(timer);
  if (!playing) return;
  if (!isVid(MEDIA[idx])) timer = setInterval(() => go(1), 4200);
}
slideVid.addEventListener('ended', () => { if (playing) go(1); });

function go(n){ idx = (idx + n + MEDIA.length) % MEDIA.length; render(); }
function play(){ playing = true; sPlay.textContent = 'Pause'; render(); }
function stop(){
  playing = false;
  sPlay.textContent = 'Play';
  clearInterval(timer);
  if (isVid(MEDIA[idx])) slideVid.pause();
}

document.getElementById('sPrev').onclick = () => { stop(); go(-1); };
document.getElementById('sNext').onclick = () => { stop(); go(1); };
sPlay.onclick = () => playing ? stop() : play();
slideImg.onclick = () => openLB(idx);

/* ---------- lightbox ---------- */
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbVid = document.getElementById('lbVid');
const lbDl = document.getElementById('lbDownload');
const lbCount = document.getElementById('lbCount');

function paintLB(){
  const m = MEDIA[idx];
  lbVid.pause();
  if (isVid(m)) {
    lbImg.style.display = 'none';
    lbVid.style.display = 'block';
    lbVid.src = viewSrc(m);
    lbVid.poster = posterOf(m);
    lbVid.play().catch(()=>{});
  } else {
    lbVid.style.display = 'none';
    lbVid.removeAttribute('src');
    lbVid.load();
    lbImg.style.display = 'block';
    lbImg.src = viewSrc(m);
    lbImg.alt = 'Wedding photo ' + (idx + 1);
  }
  lbDl.href = dlSrc(m);
  lbDl.setAttribute('download', m.f);
  lbCount.textContent = (idx + 1) + ' / ' + MEDIA.length;
}
function openLB(i){
  idx = i; stop(); slideVid.pause();
  paintLB();
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeLB(){
  lb.classList.remove('on');
  lbVid.pause();
  document.body.style.overflow = '';
  if (slideshow.classList.contains('on')) render();
}

document.getElementById('lbClose').onclick = closeLB;
document.getElementById('lbPrev').onclick = e => { e.stopPropagation(); idx = (idx - 1 + MEDIA.length) % MEDIA.length; paintLB(); };
document.getElementById('lbNext').onclick = e => { e.stopPropagation(); idx = (idx + 1) % MEDIA.length; paintLB(); };
lb.addEventListener('click', e => { if (e.target === lb || e.target === lbImg) closeLB(); });

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (lb.classList.contains('on')) {
    if (e.key === 'Escape') closeLB();
    if (e.key === 'ArrowLeft') { idx = (idx - 1 + MEDIA.length) % MEDIA.length; paintLB(); }
    if (e.key === 'ArrowRight') { idx = (idx + 1) % MEDIA.length; paintLB(); }
  } else if (slideshow.classList.contains('on')) {
    if (e.key === 'ArrowLeft') { stop(); go(-1); }
    if (e.key === 'ArrowRight') { stop(); go(1); }
    if (e.key === ' ' && e.target.tagName !== 'VIDEO') { e.preventDefault(); playing ? stop() : play(); }
  }
});

/* ---------- swipe ---------- */
let x0 = null;
[lb, slideshow].forEach(el => {
  el.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
  el.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) {
      const back = dx > 0;
      if (lb.classList.contains('on')) { idx = (idx + (back ? -1 : 1) + MEDIA.length) % MEDIA.length; paintLB(); }
      else { stop(); go(back ? -1 : 1); }
    }
    x0 = null;
  }, {passive:true});
});

setView('gallery');
</script>
</body>
</html>
